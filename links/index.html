<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umbrella’s Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8E9E4;--blush:#EDCCC3;--rose:#C98F83;--cocoa:#4A302C;--wine:#7A3B3B;--card:#FFF6F3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#E4B4A8 0%,#EDCCC3 35%,#F8E9E4 80%,#FFF 100%);color:var(--cocoa);font-family:Jost,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px;position:relative;padding:0 20px 24px;display:flex;flex-direction:column;align-items:center}
.fl{position:absolute;left:50%;transform:translateX(-50%);width:min(100vw,640px);height:auto;pointer-events:none;mix-blend-mode:multiply;opacity:.85}
.fl.top{top:0}.fl.bot{bottom:0}
.logo{position:relative;width:100%;max-width:340px;margin-top:130px;border-radius:4px;display:block}
.tag{position:relative;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:1.5rem;color:var(--wine);margin:18px 0 26px;text-align:center}
.list{position:relative;width:100%;display:flex;flex-direction:column;gap:12px}
.l{display:flex;align-items:center;gap:16px;padding:15px 18px;background:var(--card);border:1px solid #D9A79B;border-radius:999px;color:var(--cocoa);text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.l:hover,.l:focus-visible{background:var(--cocoa);color:var(--bg);border-color:var(--cocoa)}
.l:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
.i{flex:none;width:30px;height:30px;color:var(--rose)}
.l:hover .i,.l:focus-visible .i{color:var(--blush)}
.t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.t b{font-weight:500;font-size:1.05rem}
.t small{font-size:.85rem;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{height:150px}
@media (prefers-color-scheme:dark){:root{}}
</style></head><body>
